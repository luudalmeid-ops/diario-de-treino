<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diário de Treino</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=swap">
<style>
:root{color-scheme:light;--bg:#ffffff;--fg:#0f1d3a;--muted:#5f7195;--blue:#1d5cf0}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid;place-items:center;text-align:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--blue)}
p{margin:10px 0 0;font-size:18px;font-weight:600;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>Aplicativo suspenso.</h1>
<p>Continue com seus resultados atuais</p>
</main>
</body>
</html>
