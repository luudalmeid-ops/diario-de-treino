<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Diário de Treino</title>
<meta name="author" content="@ludianderson_almeida">
<meta name="theme-color" content="#1d5cf0">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: coluna única de celular, cartões brancos com selo azul arredondado por exercício, barra de navegação fixa embaixo. */
:root{
  --bg:#ffffff;
  --surface:#f4f8ff;
  --card:#ffffff;
  --line:#dbe6fb;
  --fg:#0f1d3a;
  --muted:#5f7195;
  --blue:#1d5cf0;
  --blue-strong:#1346c4;
  --blue-soft:#e6efff;
  --on-blue:#ffffff;
  --good:#12805c;
  --good-soft:#e2f6ee;
  --shadow:0 1px 2px rgba(20,60,140,.06),0 6px 18px rgba(20,60,140,.07);
  color-scheme:light;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-block:0 160px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

header.top{padding-top:20px;display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.02em;text-wrap:balance}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--surface);padding:6px;border-radius:20px;border:1px solid var(--line)}
.tab{position:relative;border:0;background:transparent;border-radius:14px;padding:11px 6px;font-weight:700;color:var(--muted);min-width:0}
.tab[aria-selected="true"]{background:var(--blue);color:var(--on-blue);box-shadow:0 4px 12px rgba(29,92,240,.3)}
.tab .next{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.tab:not([aria-selected="true"]) .next{color:var(--blue)}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px;font-weight:600}
.bar strong{color:var(--fg)}
.progress{height:8px;border-radius:99px;background:var(--blue-soft);overflow:hidden;flex:1}
.progress>i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .25s}

details.rule{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
details.rule summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:10px}
details.rule summary::-webkit-details-marker{display:none}
details.rule[open] summary{margin-bottom:8px}
details.rule p{margin:6px 0;color:var(--muted)}
details.rule b{color:var(--fg)}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card.done{border-color:var(--blue)}
.head{display:flex;gap:12px;align-items:center;min-width:0}
.badge{width:44px;height:44px;border-radius:15px;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none;box-shadow:0 4px 10px rgba(29,92,240,.25)}
.card.done .badge{background:var(--good);color:#fff}
.title{min-width:0;flex:1}
.title h2{margin:0;font-size:16px;line-height:1.25;font-weight:700;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:13px;font-weight:600;margin-top:2px}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta svg.i{width:14px;height:14px}

.vid{width:42px;height:42px;border-radius:14px;background:var(--blue-soft);color:var(--blue-strong);display:grid;place-items:center;flex:none;text-decoration:none}
.vid svg.i{fill:currentColor;stroke-width:1.5}
.goal{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--blue-soft);color:var(--blue-strong);border-radius:12px;padding:5px 10px;font-weight:800;font-size:13px}
.pill.up{background:var(--good-soft);color:var(--good)}

.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) 48px;gap:8px;align-items:center}
.set .n{width:28px;font-weight:800;color:var(--muted);font-size:13px}
.field{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 10px;height:46px;min-width:0}
.field input{width:100%;min-width:0;border:0;background:transparent;font-weight:700;font-size:16px;text-align:right;font-variant-numeric:tabular-nums;outline:0}
.field:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.field small{color:var(--muted);font-weight:700;font-size:12px}
.chk{width:48px;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:transparent;display:grid;place-items:center}
.chk[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.single{display:flex}
.single .chk{width:100%;gap:8px;grid-auto-flow:column;color:var(--muted);font-weight:700}
.single .chk[aria-pressed="true"]{color:var(--on-blue)}

.finish{display:flex;flex-direction:column;gap:8px}
.btn{border:0;border-radius:18px;background:var(--blue);color:var(--on-blue);font-weight:800;font-size:16px;padding:16px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 16px rgba(29,92,240,.3)}
.btn[disabled]{background:var(--blue-soft);color:var(--muted);box-shadow:none;cursor:not-allowed}
.btn.ghost{background:var(--blue-soft);color:var(--blue-strong);box-shadow:none;padding:11px 14px;font-size:14px;border-radius:14px}
.note{color:var(--muted);font-size:13px;text-align:center;margin:0}
.flash{background:var(--good-soft);color:var(--good);border-radius:18px;padding:12px 14px;font-weight:700}
.fut{background:var(--blue-soft);color:var(--blue-strong);border-radius:18px;padding:12px 14px;font-weight:700}

.evo{display:flex;align-items:center;gap:12px}
.evo .spark{width:96px;height:34px;flex:none}
.evo .nums{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
.evo .nums small{display:block;color:var(--muted);font-weight:600;font-size:12px}
h3{margin:8px 0 0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hist{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.hist .badge{width:38px;height:38px;border-radius:13px;font-size:16px;box-shadow:none}
.hist div.t{flex:1;min-width:0;font-weight:700}
.hist div.t small{display:block;color:var(--muted);font-weight:600}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:20px;padding:20px;text-align:center;color:var(--muted)}

.timer{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center;pointer-events:none}
.timer .in{pointer-events:auto;width:100%;max-width:560px;background:var(--fg);color:var(--bg);border-radius:20px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(10,30,90,.35)}
.timer b{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.timer span{font-weight:700;flex:1}
.timer button{border:0;background:var(--blue);color:var(--on-blue);border-radius:14px;padding:10px 16px;font-weight:800}

nav.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));z-index:5}
nav.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
nav.nav button{border:0;background:transparent;color:var(--muted);border-radius:16px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:12px}
nav.nav button .ic{width:44px;height:30px;border-radius:12px;display:grid;place-items:center}
nav.nav button[aria-current="page"]{color:var(--blue-strong)}
nav.nav button[aria-current="page"] .ic{background:var(--blue-soft)}
@media (prefers-reduced-motion:reduce){.progress>i{transition:none}}
/* ---------- Abertura (onboarding) ---------- */
.ob{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.ob .in{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px}
.ob .dots{display:flex;gap:6px;justify-content:center;padding-top:4px}
.ob .dots i{width:8px;height:8px;border-radius:99px;background:var(--line);transition:width .3s,background .3s}
.ob .dots i.on{width:24px;background:var(--blue)}
.ob .body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding-block:8px}
.ob .foot{display:flex;flex-direction:column;gap:10px}
.ob h2{margin:0;font-size:30px;line-height:1.12;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.ob .lead{margin:0;color:var(--muted);font-size:16px;line-height:1.5}
.ob .rise{opacity:1;animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.ob .d1{animation-delay:.08s}.ob .d2{animation-delay:.16s}.ob .d3{animation-delay:.24s}.ob .d4{animation-delay:.32s}.ob .d5{animation-delay:.4s}.ob .d6{animation-delay:.48s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.splash{align-items:center;text-align:center}
.mark{width:104px;height:104px;border-radius:32px;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 18px 40px rgba(29,92,240,.35);animation:pop .8s cubic-bezier(.2,1.4,.3,1) both;position:relative}
.mark svg{width:54px;height:54px;stroke:#fff;stroke-width:2.2;fill:none;stroke-linecap:round;animation:lift 2.4s ease-in-out .8s infinite}
.mark::after{content:"";position:absolute;inset:-10px;border-radius:40px;border:2px solid var(--blue);opacity:0;animation:ring 2.4s ease-out .8s infinite}
@keyframes pop{from{transform:scale(.3) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes ring{0%{opacity:.5;transform:scale(.9)}100%{opacity:0;transform:scale(1.25)}}
.splash h2{font-size:38px}
.by{display:inline-flex;align-items:center;gap:8px;background:var(--blue-soft);color:var(--blue-strong);font-weight:800;border-radius:99px;padding:8px 14px;font-size:14px}
.feat{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px}
.feat .fi{width:44px;height:44px;border-radius:15px;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.feat b{display:block;font-size:16px}
.feat span{color:var(--muted);font-size:14px;line-height:1.45}
.ob label.big{display:flex;flex-direction:column;gap:8px;font-weight:700;color:var(--muted);font-size:14px}
.ob .inp{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:0 16px;height:62px}
.ob .inp:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.ob .inp input{flex:1;min-width:0;border:0;background:transparent;font-size:22px;font-weight:800;color:var(--fg);outline:0}
.ob .inp small{font-weight:800;color:var(--muted);font-size:15px}
.ob .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ob .two>label{min-width:0}
.ob .inp{min-width:0}
.ob .inp input{width:100%}
.ob .err{color:#c0362c;font-weight:700;font-size:14px;margin:0;min-height:20px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;border:2px solid var(--line);background:var(--card);border-radius:20px;padding:14px 16px;color:var(--fg)}
.opt b{display:block;font-size:16px}
.opt span{color:var(--muted);font-size:14px}
.opt .ra{width:24px;height:24px;border-radius:99px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.opt[aria-pressed="true"] .ra{border-color:var(--blue);background:var(--blue)}
.opt[aria-pressed="true"] .ra::after{content:"";width:8px;height:8px;border-radius:99px;background:#fff}
.imc{display:flex;align-items:center;gap:16px;background:var(--blue);color:#fff;border-radius:24px;padding:18px 20px;box-shadow:0 12px 30px rgba(29,92,240,.3)}
.imc .v{font-size:44px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.imc .t{display:flex;flex-direction:column;gap:2px}
.imc .t b{font-size:16px}
.imc .t span{opacity:.85;font-size:13px;font-weight:600}
.notes{display:flex;flex-direction:column;gap:10px}
.note2{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.note2 .k{width:30px;height:30px;border-radius:10px;background:var(--good-soft);color:var(--good);display:grid;place-items:center;flex:none}
.note2 .k svg.i{width:16px;height:16px}
.note2 b{display:block;font-size:15px}
.note2 span{color:var(--muted);font-size:14px;line-height:1.45}
.note2.warn .k{background:#fff3dc;color:#9a5b00}
.fine{color:var(--muted);font-size:12px;text-align:center;margin:0;line-height:1.5}
.btn.line{background:transparent;color:var(--blue-strong);box-shadow:none;border:2px solid var(--line)}
.prof{display:flex;flex-direction:column;gap:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px;font-weight:700}
.credit{text-align:center;color:var(--muted);font-size:13px;font-weight:700;margin:8px 0 0}
.credit b{color:var(--blue-strong)}
@media (prefers-reduced-motion:reduce){.ob .rise,.mark,.mark svg,.mark::after{animation:none}.ob .dots i{transition:none}}


/* ---------- Programa v2 ---------- */
.sub{color:var(--muted);font-weight:700;font-size:14px;margin-top:-2px;display:flex;flex-wrap:wrap;gap:4px 10px}
.sub b{color:var(--blue-strong)}
.per{font-size:12px;font-weight:800;color:var(--blue-strong);background:var(--blue-soft);border-radius:8px;padding:2px 7px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.goal .hint{flex-basis:100%}
.hx{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.hx div{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;color:var(--muted);border-top:1px solid var(--line);padding-top:6px;font-variant-numeric:tabular-nums}
.hx div b{color:var(--fg)}
details.evd summary{list-style:none;cursor:pointer}
details.evd summary::-webkit-details-marker{display:none}
.wk{display:flex;flex-direction:column;gap:10px}
.wk .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.wk .big{white-space:nowrap;font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.inl{display:flex;gap:8px;align-items:center}
.inl .field{flex:1}
.inl .btn{padding:12px 16px;font-size:15px;border-radius:14px;flex:none}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:800;color:var(--muted);min-width:0}
.weekplan{display:flex;flex-direction:column;gap:10px}
.wp{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.wp .badge{width:40px;height:40px;border-radius:13px;font-size:17px;box-shadow:none}
.wp b{display:block;font-size:15px}
.wp span{color:var(--muted);font-size:13px;font-weight:600}
.wp .badge{color:var(--on-blue)}
.wp.off .badge{background:var(--blue-soft);color:var(--blue-strong)}
</style>
</head>
<body>

<div class="wrap" id="app"><p style="padding-top:24px;color:var(--muted);font-weight:700">Carregando o treino…</p></div>
<div class="timer" id="timer" hidden></div>
<nav class="nav"><div class="in">
  <button id="nav-treino" data-view="treino"><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg></span>Treino</button>
  <button id="nav-evo" data-view="evo"><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg></span>Evolução</button>
  <button id="nav-perfil" data-view="perfil"><span class="ic"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>Perfil</button>
</div></nav>
<div class="ob" id="ob" hidden></div>

<script>
window.onerror=function(m,u,l){
  var a=document.getElementById('app');
  if(a)a.innerHTML='<p style="padding-top:24px;font-weight:700">Erro ao abrir o treino. Mande este texto: '+String(m)+' (linha '+l+')</p>';
};
var IC={
  rep:'<svg class="i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15"/><path d="M4 20v-5h5"/></svg>',
  clock:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  check:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  flag:'<svg class="i" viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg>',
  up:'<svg class="i" viewBox="0 0 24 24"><path d="M12 19V6"/><path d="M6 11l6-6 6 6"/></svg>',
  play:'<svg class="i" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>',
  info:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>',
  leg:'<svg class="i" viewBox="0 0 24 24"><path d="M9 3v7l-3 8v3h4l2-7 2 7h4v-3l-3-8V3"/></svg>',
  walk:'<svg class="i" viewBox="0 0 24 24"><circle cx="13" cy="4" r="2"/><path d="M10 21l2-6 3 2v4"/><path d="M8 11l3-3 3 2 2 3"/><path d="M12 15l-1-5"/></svg>'
};
var AUTOR='@ludianderson_almeida', KEY='treino3x-v1', PKEY='treino3x-perfil', VERSION=2;
var COMP=150, ISO=75;   /* descanso: compostos 2–3 min, isoladores 60–90 s */

/* ---------- Programa ---------- */
function L(id,name,sets,lo,hi,step,comp,per){return {id:id,name:name,type:'load',sets:sets,lo:lo,hi:hi,step:step,rest:comp?COMP:ISO,comp:!!comp,per:!!per}}
function warm(k){return {id:k+'-aq',name:'Aquecimento',type:'check',sets:1,label:'5 min leves + 1 série leve do 1º exercício'}}
function cardio(k){return {id:k+'-cardio',name:'Cardio moderado',type:'cardio',sets:1,label:'10 a 15 min, se couber nos 60 min'}}
var PROGRAMS={

/* ---------- Progressão dupla ---------- */
function lastFor(id){
  for(var i=S.sessions.length-1;i>=0;i--){var e=S.sessions[i].ex[id];if(e&&e.length&&e[0].kg!=null||e&&e.length&&e[0].reps!=null)return e}
  return null;
}
/* Retorna a meta de hoje: kg, reps por série, se a carga subiu e o texto de orientação */
function target(ex){
  var last=lastFor(ex.id),i,reps=[];
  if(ex.type==='load'){
    if(!last){for(i=0;i<ex.sets;i++)reps.push(ex.lo);return {kg:null,reps:reps,up:false,last:null,
      hint:'Primeira vez: escolha uma carga em que você faça '+ex.lo+' a '+ex.hi+' reps deixando 1 a 3 sobrando.'}}
    var kg=Math.max.apply(null,last.map(function(s){return s.kg||0}));
    var top=last.length>=ex.sets&&last.slice(0,ex.sets).every(function(s){return (s.reps||0)>=ex.hi});
    if(top){for(i=0;i<ex.sets;i++)reps.push(ex.lo);
      return {kg:kg+ex.step,reps:reps,up:true,last:last,add:ex.step,hint:'Você fechou '+ex.hi+' reps em todas as séries. Sobe '+fmt(ex.step)+' kg e volta para '+ex.lo+' reps.'}}
    for(i=0;i<ex.sets;i++){var r=last[i]?(last[i].reps||ex.lo):ex.lo;reps.push(Math.min(ex.hi,Math.max(ex.lo,r+1)))}
    return {kg:kg,reps:reps,up:false,last:last,hint:'Mesma carga. Tente 1 rep a mais por série, até '+ex.hi+'.'};
  }
  if(ex.type==='time'){
    if(!last){for(i=0;i<ex.sets;i++)reps.push(ex.lo);return {reps:reps,last:null,up:false,hint:'Segure '+ex.lo+'s com o corpo alinhado.'}}
    var done=last.length>=ex.sets&&last.every(function(s){return (s.reps||0)>=ex.hi});
    for(i=0;i<ex.sets;i++){var t=last[i]?(last[i].reps||ex.lo):ex.lo;reps.push(Math.min(ex.hi,t+ex.step))}
    return {reps:reps,last:last,up:false,hint:done?'Você já segura '+ex.hi+'s. Mantenha ou use uma variação mais difícil.':'Tente +'+ex.step+'s por série, até '+ex.hi+'s.'};
  }
  return {reps:[],last:last,up:false};
}
function lastText(ex,last){
  if(!last)return '';
  if(ex.type==='load')return 'Última: '+fmt(Math.max.apply(null,last.map(function(s){return s.kg||0})))+' kg · '+last.map(function(s){return s.reps}).join('/')+' reps';
  if(ex.type==='time')return 'Última: '+last.map(function(s){return s.reps+'s'}).join(' / ');
  return '';
}
function nextWorkout(){var l=S.sessions[S.sessions.length-1];return l?ORDER[(ORDER.indexOf(l.treino)+1)%3]:ORDER[0]}
function draftFor(w,ex){
  var d=S.draft[w.id]||(S.draft[w.id]={});
  if(!d[ex.id]||d[ex.id].length!==ex.sets){
    var t=target(ex),arr=[];
    for(var i=0;i<ex.sets;i++){
      if(ex.type==='load')arr.push({kg:t.kg==null?'':t.kg,reps:t.reps[i],done:false});
      else if(ex.type==='time')arr.push({kg:'',reps:t.reps[i],done:false});
      else if(ex.type==='cardio')arr.push({min:12,done:false});
      else arr.push({done:false});
    }
    d[ex.id]=arr;
  }
  return d[ex.id];
}
/* Duração estimada: aquecimento 5 min, 45s por série (o dobro se for por perna), descanso entre séries, 1 min de troca, cardio 12 min */
function duration(w){
  var s=0;
  w.ex.forEach(function(ex){
    if(ex.type==='check')s+=300;else if(ex.type==='cardio')s+=720;
    else s+=ex.sets*(ex.type==='time'?40:45)*(ex.per?2:1)+(ex.sets-1)*ex.rest+60;
  });
  return Math.round(s/60);
}

      rows+='<div class="set"><span class="n">S'+(s+1)+'</span>'+f1+f2+'<button class="chk" data-act="toggle" '+a+' aria-pressed="'+st.done+'" aria-label="Concluir série '+(s+1)+'">'+IC.check+'</button></div>';
    }

  }

  return '<section class="card'+(allDone?' done':'')+'"><div class="head"><div class="badge">'+(allDone?IC.check:(i+1))+'</div><div class="title"><h2>'+esc(ex.name)+(ex.per?'<span class="per">por perna</span>':'')+'</h2><div class="meta">'+meta+'</div></div>'+vid+'</div>'+goal+rows+'</section>';

function renderTreino(){

function spark(vals){
  if(vals.length<2)return '<svg class="spark" viewBox="0 0 96 34" aria-hidden="true"><circle cx="48" cy="17" r="4" fill="var(--blue)"/></svg>';
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),r=(mx-mn)||1;
  var pts=vals.map(function(v,i){return (4+i*(88/(vals.length-1))).toFixed(1)+','+(30-((v-mn)/r)*26).toFixed(1)}),lp=pts[pts.length-1].split(',');
  return '<svg class="spark" viewBox="0 0 96 34" aria-hidden="true"><polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+lp[0]+'" cy="'+lp[1]+'" r="4" fill="var(--blue)"/></svg>';
}
function weekStart(){var d=new Date();d.setHours(0,0,0,0);var k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return d}
function cardioWeek(){
  var ws=weekStart().getTime(),gym=0,walk=0;
  S.sessions.forEach(function(se){if(new Date(se.date).getTime()>=ws&&se.cardio)gym+=se.cardio});
  (S.walks||[]).forEach(function(x){if(new Date(x.date).getTime()>=ws)walk+=x.min});
  return {gym:gym,walk:walk,total:gym+walk};
}

    +'<p class="note" style="text-align:left">Referência: 150 a 300 minutos por semana de atividade moderada, somando cardio e caminhadas.</p></div>';
  var any=false;
  W.forEach(function(w){
    var rows='';
    w.ex.forEach(function(ex){
      if(ex.type!=='load'&&ex.type!=='time')return;
      var hist=[];
      S.sessions.forEach(function(se){var e=se.ex[ex.id];if(e&&e.length)hist.push({label:se.label,sets:e})});

      rows+='<details class="card evd"><summary class="evo"><div class="title"><h2>'+esc(ex.name)+'</h2><div class="meta"><span>'+hist.length+(hist.length===1?' treino':' treinos')+' · toque para ver</span></div></div>'+spark(vals)+'<div class="nums">'+fmt(b)+u+'<small>'+(dl>0?'+'+fmt(dl)+u:dl<0?fmt(dl)+u:'sem mudança')+'</small></div></summary><div class="hx">'+list+'</div></details>';
    });

  if(S.sessions.length){
    h+='<h3>Histórico</h3>';
    for(var i=S.sessions.length-1;i>=Math.max(0,S.sessions.length-12);i--){
      var se=S.sessions[i],n=Object.keys(se.ex).length,k=(W[se.treino-1]||{}).key||se.treino;
      h+='<div class="hist"><div class="badge">'+k+'</div><div class="t">Treino '+k+'<small>'+esc(se.label)+' · '+n+' exercícios</small></div><button class="btn ghost" data-act="del" data-i="'+i+'">'+(armed===i?'Confirmar':'Remover')+'</button></div>';
    }
  }
  app.innerHTML=h;
}
function renderPerfil(){
  var h=header('Perfil');
  if(!P){h+='<div class="empty">Você ainda não preencheu seus dados.</div><button class="btn" data-act="perfil-edit">Preencher meus dados</button>';app.innerHTML=h;return}
  var i=imcOf(P),B=S.body||[];
  h+='<div class="prof"><div class="imc"><span class="v">'+fmt(Math.round(i*10)/10)+'</span><div class="t"><b>'+esc(P.nome)+'</b><span>Foco: '+focoOf().nome+' · IMC '+faixa(i).toLowerCase()+'</span></div></div>'
    +'<div class="stats"><div class="stat"><b>'+esc(P.altura)+'</b><span>cm</span></div><div class="stat"><b>'+esc(fmt(P.peso))+'</b><span>kg</span></div><div class="stat"><b>'+S.sessions.length+'</b><span>treinos</span></div></div>'
    +'<div class="card"><h2 style="margin:0;font-size:16px">Peso e medidas</h2><p class="note" style="text-align:left;margin:0">Registre a cada 1 ou 2 semanas, de manhã, em jejum. As medidas são opcionais.</p>'
    +'<div class="form">'
    +'<label>Peso<span class="field"><input id="m-peso" type="text" inputmode="decimal" placeholder="'+esc(fmt(P.peso))+'"><small>kg</small></span></label>'
    +'<label>Cintura<span class="field"><input id="m-cintura" type="text" inputmode="decimal" placeholder="—"><small>cm</small></span></label>'
    +'<label>Quadril<span class="field"><input id="m-quadril" type="text" inputmode="decimal" placeholder="—"><small>cm</small></span></label>'
    +'<label>Coxa<span class="field"><input id="m-coxa" type="text" inputmode="decimal" placeholder="—"><small>cm</small></span></label>'
    +'</div><button class="btn" data-act="body">Salvar medidas</button>';
  if(B.length){
    var pv=B.filter(function(x){return x.peso}).map(function(x){return x.peso});
    if(pv.length>1)h+='<div class="evo"><span class="note" style="text-align:left">Peso ao longo do tempo</span>'+spark(pv)+'<div class="nums">'+fmt(pv[pv.length-1])+' kg<small>'+(function(){var d=pv[pv.length-1]-pv[0];return (d>0?'+':'')+fmt(d)+' kg desde o início'})()+'</small></div></div>';
    h+='<div class="hx">'+B.slice(-8).reverse().map(function(x){var p=[];if(x.peso)p.push(fmt(x.peso)+' kg');if(x.cintura)p.push('cintura '+fmt(x.cintura));if(x.quadril)p.push('quadril '+fmt(x.quadril));if(x.coxa)p.push('coxa '+fmt(x.coxa));return '<div><span>'+esc(x.label)+'</span><b>'+p.join(' · ')+'</b></div>'}).join('')+'</div>';
  }
  h+='</div><button class="btn" data-act="perfil-foco">Trocar o foco do treino</button><button class="btn line" data-act="perfil-edit">Editar nome, altura e peso</button>'
    +'<button class="btn line" data-act="perfil-intro">Ver a apresentação de novo</button>'
    +'<p class="fine">O IMC é uma referência simples e não mede gordura nem músculo. Cintura, quadril e coxa mostram melhor a recomposição corporal. Este app não substitui um profissional de educação física.</p>'
    +'<p class="credit">Desenvolvido por <b>'+AUTOR+'</b></p></div>';
  app.innerHTML=h;
}
function render(){
  var y=window.scrollY;
  ['treino','evo','perfil'].forEach(function(v){document.getElementById('nav-'+v).setAttribute('aria-current',view===v?'page':'false')});
  if(view==='treino')renderTreino();else if(view==='perfil')renderPerfil();else renderEvo();
  window.scrollTo(0,y);
}

/* ---------- Cronômetro ---------- */
var tEnd=0,tInt=null,timerEl=document.getElementById('timer');
function startRest(sec){tEnd=Date.now()+sec*1000;clearInterval(tInt);tick();tInt=setInterval(tick,250)}
function stopRest(){clearInterval(tInt);tInt=null;timerEl.hidden=true}
function tick(){
  var left=Math.ceil((tEnd-Date.now())/1000);
  if(left<=0){
    try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
    timerEl.hidden=false;timerEl.innerHTML='<div class="in" role="status"><span>Descanso acabou. Próxima série.</span><button data-act="skip">Ok</button></div>';
    clearInterval(tInt);tInt=null;setTimeout(function(){if(!tInt)timerEl.hidden=true},6000);return;
  }
  timerEl.hidden=false;timerEl.innerHTML='<div class="in" role="timer"><b>'+mmss(left)+'</b><span>Descanso</span><button data-act="skip">Pular</button></div>';
}

/* ---------- Eventos ---------- */
function find(wid,eid){var w=W[wid-1];return {w:w,ex:w.ex.filter(function(e){return e.id===eid})[0]}}
document.addEventListener('input',function(e){
  var t=e.target;if(!t.dataset||!t.dataset.f||!t.dataset.w)return;
  var f=find(+t.dataset.w,t.dataset.e);draftFor(f.w,f.ex)[+t.dataset.s][t.dataset.f]=t.value;save();
});
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act],[data-tab],[data-view]');if(!el||el.closest('#ob'))return;
  if(el.dataset.view){view=el.dataset.view;flash='';armed=null;render();window.scrollTo(0,0);return}
  if(el.dataset.tab){cur=+el.dataset.tab;flash='';render();return}
  var act=el.dataset.act;
  if(act==='skip'){stopRest();return}
  if(act==='toggle'){
    var f=find(+el.dataset.w,el.dataset.e),s=draftFor(f.w,f.ex)[+el.dataset.s];
    s.done=!s.done;
    if(s.done&&(f.ex.type==='load'||f.ex.type==='time'))startRest(f.ex.rest);
    flash='';save();render();return;
  }
  if(act==='finish'){finish();return}
  if(act==='del'){var i=+el.dataset.i;if(armed===i){S.sessions.splice(i,1);armed=null;saveNow()}else armed=i;render();return}
  if(act==='walk'){
    var m=num(document.getElementById('walk-min').value);
    if(m&&m>0&&m<600){S.walks.push({date:new Date().toISOString(),min:Math.round(m)});saveNow();render()}
    return;
  }
  if(act==='body'){
    var o={date:new Date().toISOString(),label:shortDate()},any=false;
    ['peso','cintura','quadril','coxa'].forEach(function(k){var v=num(document.getElementById('m-'+k).value);if(v&&v>0){o[k]=v;any=true}});
    if(!any)return;
    S.body.push(o);if(o.peso){P.peso=o.peso;lsSet(PKEY,P)}saveNow();render();return;
  }
  if(act==='perfil-edit'){if(P)openOb(2,'dados');else openOb(0,'');return}
  if(act==='perfil-foco'){openOb(5,'foco');return}
  if(act==='perfil-intro'){openOb(0,'');return}
});
function shortDate(){try{return new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.','')}catch(x){return ''}}
function finish(){
  var w=W[cur-1],d=S.draft[w.id]||{},ex={},n=0,cmin=0;
  w.ex.forEach(function(e){
    var sets=(d[e.id]||[]).filter(function(s){return s.done});
    if(!sets.length)return;
    if(e.type==='cardio'){cmin=Math.round(num(sets[0].min)||0);return}
    if(e.type==='check')return;
    ex[e.id]=sets.map(function(s){return {kg:num(s.kg),reps:num(s.reps)||0}});n++;
  });
  if(!n&&!cmin)return;
  S.sessions.push({treino:w.id,foco:(P&&P.foco)||'inf',date:new Date().toISOString(),label:shortDate(),ex:ex,cardio:cmin});
  delete S.draft[w.id];
  var ups=0;w.ex.forEach(function(e){if(e.type==='load'&&ex[e.id]&&target(e).up)ups++});
  stopRest();cur=nextWorkout();
  flash='Treino salvo. '+(ups?ups+(ups===1?' exercício sobe':' exercícios sobem')+' de carga na próxima vez.':'Na próxima, busque 1 repetição a mais por série.');
  saveNow();render();window.scrollTo(0,0);
}

/* ---------- Abertura animada ---------- */
/* Passos: 0 apresentação · 1 como funciona · 2 nome · 3 tratamento · 4 altura e peso · 5 foco · 6 semana */
var ob={step:0,nome:'',trat:'',altura:'',peso:'',foco:'',err:'',mode:''},obEl=document.getElementById('ob'),countT=null;
var TRAT=[['f','No feminino','“Bem-vinda”, “pronta”'],['m','No masculino','“Bem-vindo”, “pronto”'],['n','Tanto faz','Linguagem neutra']];
function g(f,m,n){var t=(P&&P.trat)||ob.trat;return t==='f'?f:t==='m'?m:n}
function openOb(step,mode){
  ob.step=step||0;ob.mode=mode||'';ob.err='';
  if(P){ob.nome=P.nome;ob.trat=P.trat||'';ob.altura=String(P.altura);ob.peso=String(P.peso);ob.foco=P.foco||''}
  obEl.hidden=false;document.body.style.overflow='hidden';renderOb();
}
function stopCount(){if(countT){clearInterval(countT);countT=null}}
function closeOb(){obEl.hidden=true;document.body.style.overflow='';stopCount()}
function weekPlan(cls){
  var h='<div class="weekplan">';
  W.forEach(function(w,i){h+='<div class="wp '+(cls?cls+' d'+(i+2):'')+'"><span class="badge">'+w.key+'</span><div><b>'+w.dia+' · '+w.foco+'</b><span>'+(w.ex.length-2)+' exercícios + cardio · ≈ '+duration(w)+' min</span></div></div>'});
  h+='<div class="wp off '+(cls?cls+' d5':'')+'"><span class="badge">'+IC.walk+'</span><div><b>Terça, quinta e fim de semana</b><span>Caminhada leve a moderada</span></div></div>';
  return h+'</div>';
}
function optBtn(kind,v,title,sub,on,i){return '<button class="opt rise d'+(i+1)+'" data-ob="'+kind+'" data-v="'+v+'" aria-pressed="'+on+'"><span class="ra"></span><div><b>'+title+'</b><span>'+sub+'</span></div></button>'}
function back2(){return '<button class="btn line" data-ob="back">'+(ob.mode&&ob.step===(ob.mode==='foco'?5:2)?'Cancelar':'Voltar')+'</button>'}
function renderOb(){
  stopCount();
  var st=ob.step,total=7,h='<div class="in">',nm=esc(ob.nome.trim().split(/\s+/)[0]||'');
  h+='<div class="dots" aria-hidden="true">'+Array.apply(null,{length:total}).map(function(_,i){return '<i class="'+(i===st?'on':'')+'"></i>'}).join('')+'</div>';
  if(st===0){
    h+='<div class="body splash"><div class="mark"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg></div>'
      +'<h2 class="rise d2">Diário de Treino</h2>'
      +'<p class="lead rise d3">Três treinos por semana, no foco que você escolher, com a sua evolução registrada série por série.</p>'
      +'<span class="by rise d4">Desenvolvido por '+AUTOR+'</span></div>'
      +'<div class="foot rise d5"><button class="btn" data-ob="next">Começar</button></div>';
  }else if(st===1){
    h+='<div class="body"><h2 class="rise">Como funciona</h2>'
      +'<div class="feat rise d1"><span class="fi">'+IC.leg+'</span><div><b>Você escolhe o foco</b><span>Glúteos e pernas, corpo equilibrado ou parte de cima. Dá para trocar depois.</span></div></div>'
      +'<div class="feat rise d2"><span class="fi">'+IC.up+'</span><div><b>Progressão dupla</b><span>Primeiro sobem as repetições. Quando todas as séries chegam ao topo da faixa, sobe a carga.</span></div></div>'
      +'<div class="feat rise d3"><span class="fi">'+IC.clock+'</span><div><b>Descanso certo para cada exercício</b><span>2 a 3 minutos nos compostos e 60 a 90 segundos nos isoladores.</span></div></div>'
      +'<div class="feat rise d4"><span class="fi">'+IC.flag+'</span><div><b>Seus dados ficam no seu celular</b><span>Nada é enviado para lugar nenhum. Use sempre o mesmo navegador.</span></div></div>'
      +'</div><div class="foot rise d5"><button class="btn" data-ob="next">Continuar</button></div>';
  }else if(st===2){
    h+='<div class="body"><h2 class="rise">Como podemos te chamar?</h2>'
      +'<label class="big rise d1">Seu nome<span class="inp"><input id="ob-nome" type="text" autocomplete="given-name" maxlength="40" placeholder="Digite seu nome" value="'+esc(ob.nome)+'"></span></label>'
      +'<p class="err" role="alert">'+esc(ob.err)+'</p></div>'
      +'<div class="foot rise d2"><button class="btn" data-ob="next">Continuar</button>'+back2()+'</div>';
  }else if(st===3){
    h+='<div class="body"><h2 class="rise">Prazer, '+nm+'! Como o app deve falar com você?</h2>'
      +TRAT.map(function(t,i){return optBtn('trat',t[0],t[1],t[2],ob.trat===t[0],i)}).join('')
      +'<p class="fine rise d4" style="text-align:left">Isso muda só a linguagem. O treino é escolhido pelo foco, no próximo passo.</p>'
      +'<p class="err" role="alert">'+esc(ob.err)+'</p></div>'
      +'<div class="foot rise d5"><button class="btn" data-ob="next">Continuar</button>'+back2()+'</div>';
  }else if(st===4){
    h+='<div class="body"><h2 class="rise">'+nm+', qual é a sua altura e o seu peso?</h2><p class="lead rise d1">É o ponto de partida para acompanhar a sua recomposição corporal.</p>'
      +'<div class="two rise d2"><label class="big">Altura<span class="inp"><input id="ob-alt" type="text" inputmode="decimal" maxlength="4" placeholder="175" value="'+esc(ob.altura)+'"><small>cm</small></span></label>'
      +'<label class="big">Peso<span class="inp"><input id="ob-peso" type="text" inputmode="decimal" maxlength="5" placeholder="78" value="'+esc(ob.peso)+'"><small>kg</small></span></label></div>'
      +'<p class="err" role="alert">'+esc(ob.err)+'</p></div>'
      +'<div class="foot rise d3"><button class="btn" data-ob="next">'+(ob.mode==='dados'?'Salvar':'Continuar')+'</button>'+back2()+'</div>';
  }else if(st===5){
    h+='<div class="body"><h2 class="rise">Qual é o seu foco, '+nm+'?</h2>'
      +FOCOS.map(function(k,i){var p=PROGRAMS[k],v=volume(k);return optBtn('foco',k,p.nome,p.desc+' <br><strong style="color:var(--blue-strong)">'+v.lo+' séries de pernas · '+v.up+' de parte de cima por semana</strong>',ob.foco===k,i)}).join('')
      +'<p class="err" role="alert">'+esc(ob.err)+'</p></div>'
      +'<div class="foot rise d4"><button class="btn" data-ob="next">Ver minha semana</button>'+back2()+'</div>';
  }else{
    var i=imcOf(P);setFocus(P.foco);
    h+='<div class="body"><h2 class="rise">'+g('Pronta','Pronto','Tudo pronto')+', '+esc(firstName())+'! Esta é a sua semana.</h2>'
      +'<div class="imc rise d1"><span class="v" id="imc-v">0</span><div class="t"><b>Foco: '+focoOf().nome+'</b><span>IMC '+faixa(i).toLowerCase()+' · '+esc(P.altura)+' cm · '+esc(fmt(P.peso))+' kg</span></div></div>'
      +weekPlan('rise')
      +'<p class="fine rise d6">O IMC é só uma referência e não mede gordura nem músculo. Este app não substitui a orientação de um profissional de educação física.</p></div>'
      +'<div class="foot rise d6"><button class="btn" data-ob="done">'+(ob.mode?'Salvar e voltar':'Ir para o treino')+'</button></div>';
  }
  obEl.innerHTML=h+'</div>';obEl.scrollTop=0;
  if(st===6){
    var tg=Math.round(imcOf(P)*10)/10,k=0,el=document.getElementById('imc-v'),reduce=false;
    try{reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
    if(reduce)el.textContent=fmt(tg);else countT=setInterval(function(){k++;el.textContent=fmt(Math.round(tg*k/24*10)/10);if(k>=24){el.textContent=fmt(tg);stopCount()}},30);
  }
  var f=obEl.querySelector('input');if(f)setTimeout(function(){try{f.focus({preventScroll:true})}catch(e){}},350);
}
function saveProfile(){
  var first=!P||!(S.body&&S.body.length);
  var oldFoco=P&&P.foco;
  P={nome:ob.nome,trat:ob.trat||'n',altura:Math.round(num(ob.altura)),peso:num(ob.peso),foco:ob.foco||(P&&P.foco)||'',criado:(P&&P.criado)||new Date().toISOString()};
  lsSet(PKEY,P);
  if(first&&P.peso){S.body.push({date:new Date().toISOString(),label:shortDate(),peso:P.peso})}
  if(P.foco&&P.foco!==oldFoco){S.draft={}}
  if(P.foco)setFocus(P.foco);
  saveNow();
}
function obNext(){
  ob.err='';
  if(ob.step===2){var n=document.getElementById('ob-nome').value.trim();ob.nome=n;if(n.length<2){ob.err='Digite seu nome para continuar.';renderOb();return}}
  else if(ob.step===3){if(!ob.trat){ob.err='Escolha uma opção para continuar.';renderOb();return}}
  else if(ob.step===4){
    var a=num(document.getElementById('ob-alt').value),p=num(document.getElementById('ob-peso').value);
    ob.altura=document.getElementById('ob-alt').value;ob.peso=document.getElementById('ob-peso').value;
    if(a!=null&&a<3)a=a*100;
    if(a==null||a<120||a>230){ob.err='Digite a altura em centímetros, entre 120 e 230. Exemplo: 175.';renderOb();return}
    if(p==null||p<30||p>250){ob.err='Digite o peso em quilos, entre 30 e 250. Exemplo: 78.';renderOb();return}
    ob.altura=String(Math.round(a));ob.peso=String(p);
    if(ob.mode==='dados'){saveProfile();closeOb();view='perfil';render();return}
  }
  else if(ob.step===5){if(!ob.foco){ob.err='Escolha um foco para continuar.';renderOb();return}saveProfile()}
  ob.step=Math.min(6,ob.step+1);renderOb();
}
obEl.addEventListener('click',function(e){
  var b=e.target.closest('[data-ob]');if(!b)return;var a=b.dataset.ob;
  if(a==='next')obNext();
  else if(a==='back'){
    if(ob.mode&&ob.step===(ob.mode==='foco'?5:2)){closeOb();return}
    if(ob.step===2)ob.nome=document.getElementById('ob-nome').value;
    if(ob.step===4){ob.altura=document.getElementById('ob-alt').value;ob.peso=document.getElementById('ob-peso').value}
    ob.err='';ob.step=Math.max(0,ob.step-1);renderOb();
  }
  else if(a==='trat'||a==='foco'){ob[a]=b.dataset.v;ob.err='';var er=obEl.querySelector('.err');if(er)er.textContent='';obEl.querySelectorAll('[data-ob="'+a+'"]').forEach(function(o){o.setAttribute('aria-pressed',String(o.dataset.v===ob[a]))})}
  else if(a==='done'){var m=ob.mode;closeOb();view=m?'perfil':'treino';cur=nextWorkout();render();window.scrollTo(0,0)}
});
obEl.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();obNext()}});

/* ---------- Início ---------- */
(function boot(){
  var l=lsGet(KEY);
  if(l&&l.sessions){S=l}
  if(!S.draft)S.draft={};if(!S.walks)S.walks=[];if(!S.body)S.body=[];
  if(S.v!==VERSION){S.draft={};S.v=VERSION;lsSet(KEY,S)}
  P=lsGet(PKEY);
  if(P&&P.foco)setFocus(P.foco);
  cur=nextWorkout();render();
  if(!P)openOb(0,'');
  else if(!P.foco)openOb(5,'novo-foco');
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){})}catch(e){}
})();
</script>
